<div class="chatbot" id="chatbot">

    <!-- Floating chatbot button -->
    <button
        class="chatbot-toggle"
        id="chatbot-toggle"
        type="button"
        aria-label="Open shopping assistant"
    >
        <i class="fas fa-comments"></i>
    </button>

    <!-- Chatbot window -->
    <div
        class="chatbot-window"
        id="chatbot-window"
        hidden
    >

        <!-- Header -->
        <div class="chatbot-header">

            <div class="chatbot-header-info">
                <strong>Boutique Assistant</strong>
                <small>Online</small>
            </div>

            <button
                id="chatbot-close"
                type="button"
                aria-label="Close shopping assistant"
            >
                &times;
            </button>

        </div>

        <!-- Messages -->
        <div
            class="chatbot-messages"
            id="chatbot-messages"
            aria-live="polite"
            aria-relevant="additions"
        >

            <div class="chat-message bot-message">
                Hi! 👋 I'm the Boutique Ado shopping assistant.
                How can I help you today?
            </div>

        </div>

        <!-- Quick suggestion buttons -->
        <div class="chatbot-suggestions">

            <button
                type="button"
                data-message="Show me products"
                class="chatbot-suggestion"
            >
                Products
            </button>

            <button
                type="button"
                data-message="Tell me about delivery"
                class="chatbot-suggestion"
            >
                Delivery
            </button>

            <button
                type="button"
                data-message="What is your returns policy?"
                class="chatbot-suggestion"
            >
                Returns
            </button>

        </div>

        <!-- Message input -->
        <form id="chatbot-form">

            <label
                for="chatbot-input"
                class="sr-only"
            >
                Type your message
            </label>

            <input
                type="text"
                id="chatbot-input"
                name="message"
                maxlength="500"
                autocomplete="off"
                placeholder="Ask me something..."
                required
            >

            <button
                type="submit"
                id="chatbot-send"
                aria-label="Send message"
            >
                <i class="fas fa-paper-plane"></i>
            </button>

        </form>

    </div>

</div>
